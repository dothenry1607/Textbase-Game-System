[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doplayinggame"
version = "0.1.0"
description = "A minimal, modular text-based RPG framework for Python"
authors = [
    {name = "Henry Do", email = "dothenry1607@example.com"}  # Replace with actual
]
readme = "README.md"
license = {text = "MIT"}  # Assuming from LICENSE
requires-python = ">=3.8"
dependencies = [
    "pygame",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Games/Entertainment :: Role-Playing",
]

[project.urls]
Homepage = "https://github.com/dothenry1607/Textbase-Game-System"
Repository = "https://github.com/dothenry1607/Textbase-Game-System"

[tool.setuptools]
py-modules = ["dpg"]

[tool.setuptools.packages.find]
where = ["."]
include = ["DPG"]